<section class="games-section" [class.games-section--modal]="mode === 'modal'" aria-labelledby="games-section-title">

  <!-- ═══════════════════════════════════════════════
       SECTION HEADER
       ═══════════════════════════════════════════════ -->
  <!-- <div class="games-header">

    <div class="games-label">
      <span class="games-label-line"></span>
      <span>AI PLAYGROUND</span>
    </div>

    <h2 id="games-section-title">The AI Playground</h2>

    <p class="games-subtitle">
      Think. Hack. Solve. Outsmart the system.
    </p>

    <p class="games-description">
      Test your problem-solving skills with our interactive AI challenges.
    </p>

  </div> -->


  <!-- ═══════════════════════════════════════════════
       GAME CARDS GRID
       Each card opens the game in the shared modal.
       ═══════════════════════════════════════════════ -->
  <div class="games-grid" role="list">

    @for (game of games; track game.id) {

    <button class="game-card" type="button" role="listitem" [attr.aria-label]="'Play ' + game.name"
      (click)="openGame(game)">
      <!-- Top accent line (visible on hover) -->
      <div class="game-card-accent" aria-hidden="true"></div>

      <!-- Icon -->
      <div class="game-card-icon" aria-hidden="true">
        {{ game.icon }}
      </div>

      <!-- Tag -->
      <div class="game-card-tag">{{ game.tag }}</div>

      <!-- Name -->
      <h3 class="game-card-name">{{ game.name }}</h3>

      <!-- Description -->
      <p class="game-card-desc">{{ game.description }}</p>

      <!-- Footer -->
      <div class="game-card-footer">
        <span class="game-card-difficulty" [ngClass]="'diff-' + game.difficulty.toLowerCase()">
          {{ game.difficulty }}
        </span>
        <span class="game-card-play-cta">
          Play Now
          <span class="game-card-arrow" aria-hidden="true">→</span>
        </span>
      </div>

    </button>

    }

  </div>

</section>


<!-- ═══════════════════════════════════════════════════════════════
     SHARED GAME MODAL OVERLAY
     Renders any game component dynamically via NgComponentOutlet.
     ONE overlay for ALL games — no new modal code per game ever.
     ═══════════════════════════════════════════════════════════════ -->
@if (activeGame) {

<div class="game-modal-overlay" role="dialog" [attr.aria-modal]="true" [attr.aria-label]="activeGame.name + ' game'"
  (click)="closeModal()">
  <div class="game-modal" (click)="$event.stopPropagation()">

    <!-- Modal Header -->
    <div class="game-modal-header">

      <div class="game-modal-title-group">
        <span class="game-modal-icon" aria-hidden="true">{{ activeGame.icon }}</span>
        <div>
          <div class="game-modal-tag">{{ activeGame.tag }}</div>
          <h2 class="game-modal-title">{{ activeGame.name }}</h2>
        </div>
      </div>

      <button class="game-modal-close" type="button" aria-label="Close game" (click)="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>

    </div>

    <!-- Dynamic Game Content -->
    <div class="game-modal-body">
      <ng-container [ngComponentOutlet]="activeGame.component"></ng-container>
    </div>

  </div>
</div>

}
