<div class="login-container">

  <!-- Background decoration -->
  <div class="login-glow login-glow-one"></div>
  <div class="login-glow login-glow-two"></div>

  <div class="login-content">

    <!-- Left branding section -->
    <div class="login-branding">

      <div class="brand-logo">
        <img src="images/ilink-logo.png" alt="iLink Digital">
      </div>

      <div class="brand-line"></div>

      <span class="brand-eyebrow">
        IDEAS <span>|</span> PEOPLE <span>|</span> INNOVATION <span>|</span> IMPACT
      </span>

      <h1>
        Welcome to
        <strong>i² CLUB</strong>
      </h1>

      <p class="brand-description">
        A community built for ideas, innovation and the people
        shaping the future with AI.
      </p>

      <div class="brand-highlight">
        <span class="highlight-dot"></span>
        <span>Explore. Innovate. Make an Impact.</span>
      </div>

    </div>


    <!-- Login section -->
    <div class="login-card">

      <div class="login-header">

        <span class="login-label">
          MEMBER ACCESS
        </span>

        <h2>
          Welcome back
        </h2>

        <p>
          Sign in to continue your journey with i² Club.
        </p>

      </div>


      <div class="login-form">

        <!-- First & Last Name -->
        <div class="name-row">

          <div class="form-group">
            <label for="firstName">
              First Name
            </label>

            <input id="firstName" type="text" placeholder="Enter first name" [(ngModel)]="firstName">
          </div>

          <div class="form-group">
            <label for="lastName">
              Last Name
            </label>

            <input id="lastName" type="text" placeholder="Enter last name" [(ngModel)]="lastName">
          </div>

        </div>


        <!-- Email -->
        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="m3 7 9 6 9-6"></path>
              </svg>
            </span>

            <input id="email" type="email" placeholder="Enter your email" [(ngModel)]="email">

          </div>

        </div>


        <!-- Password -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                <circle cx="12" cy="15" r="1"></circle>
              </svg>
            </span>

            <input id="password" type="password" placeholder="Enter your password" [(ngModel)]="password">

          </div>

        </div>


        <!-- Error -->
        @if (error) {
        <div class="error-message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v5"></path>
            <path d="M12 16h.01"></path>
          </svg>

          <span>{{ error }}</span>
        </div>
        }


        <!-- Login button -->
        <button type="button" class="login-submit" (click)="login()">

          <span>Login to i² Club</span>

          <span class="submit-arrow">
            →
          </span>

        </button>


        <div class="login-footer">
          <span class="footer-line"></span>

          <a href="/home">
            Back to Home
          </a>

          <span class="footer-line"></span>
        </div>

      </div>

    </div>

  </div>

</div>
